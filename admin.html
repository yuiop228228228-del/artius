<!DOCTYPE html>
<html lang="ru">

<head>

    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#25285c">

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Artius — Админ-панель</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top right, #25204a, transparent 40%),
                #08080b;

            color: white;
            font-family: Arial, sans-serif;
        }


        .admin-page {
            min-height: 100vh;
            padding: 50px 20px;
        }


        .admin-container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }


        /* ШАПКА */

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 30px;
            margin-bottom: 40px;
        }


        .admin-subtitle {
            color: #9d7cff;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }


        .admin-header h1 {
            font-size: 56px;
            letter-spacing: -3px;
            margin-bottom: 10px;
        }


        .admin-description {
            color: #888;
            font-size: 16px;
        }


        .admin-back {
            color: #aaa;
            text-decoration: none;
            padding: 12px 18px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
        }


        .admin-back:hover {
            color: white;
            border-color: rgba(255,255,255,0.3);
        }


        /* СТАТИСТИКА */

        .admin-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 35px;
        }


        .stat-card {
            padding: 22px;
            border-radius: 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
        }


        .stat-card span {
            display: block;
            color: #888;
            font-size: 14px;
            margin-bottom: 8px;
        }


        .stat-card strong {
            font-size: 32px;
        }


        /* ЗАЯВКИ */

        .applications {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }


        .application-card {
            padding: 25px;
            border-radius: 18px;
            background: rgba(255,255,255,0.045);
            border: 1px solid rgba(255,255,255,0.08);
        }


        .application-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 25px;
        }


        .application-top h2 {
            margin-top: 10px;
            font-size: 25px;
        }


        .application-id {
            color: #555;
            font-size: 12px;
        }


        /* СТАТУС */

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
        }


        .status-new {
            background: rgba(255,190,50,0.12);
            color: #ffc14d;
        }


        .status-confirmed {
            background: rgba(70,220,130,0.12);
            color: #55df8a;
        }


        .status-rejected {
            background: rgba(255,80,90,0.12);
            color: #ff6872;
        }


        /* ИНФОРМАЦИЯ */

        .application-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-bottom: 20px;
        }


        .info-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }


        .info-label {
            color: #777;
            font-size: 12px;
        }


        .info-item strong {
            font-size: 15px;
        }


        /* КОММЕНТАРИЙ */

        .application-comment {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 12px;
            background: rgba(255,255,255,0.035);
        }


        .application-comment span {
            color: #777;
            font-size: 12px;
        }


        .application-comment p {
            margin-top: 6px;
            color: #ddd;
        }


        /* КНОПКИ */

        .application-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }


        .application-actions a,
        .application-actions button {
            padding: 12px 16px;
            border-radius: 11px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            border: none;
            transition: 0.2s;
        }


        .whatsapp-button {
            background: #25d366;
            color: white;
        }


        .whatsapp-button:hover {
            transform: translateY(-2px);
        }


        .confirm-button {
            background: rgba(70,220,130,0.12);
            color: #55df8a;
            border: 1px solid rgba(70,220,130,0.2) !important;
        }


        .confirm-button:hover {
            background: rgba(70,220,130,0.2);
        }


        .reject-button {
            background: rgba(255,80,90,0.10);
            color: #ff6872;
            border: 1px solid rgba(255,80,90,0.2) !important;
        }


        .reject-button:hover {
            background: rgba(255,80,90,0.18);
        }


        /* ЕСЛИ ЗАЯВОК НЕТ */

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #777;
        }


        .empty-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }


        .empty-state h2 {
            color: #ccc;
            margin-bottom: 8px;
        }


        .empty-state p {
            max-width: 400px;
            margin: 0 auto;
            line-height: 1.5;
        }


        /* ТЕЛЕФОН */

        @media (max-width: 700px) {

            .admin-page {
                padding: 35px 15px;
            }


            .admin-header {
                flex-direction: column;
            }


            .admin-header h1 {
                font-size: 45px;
            }


            .admin-stats {
                grid-template-columns: 1fr;
            }


            .application-info {
                grid-template-columns: 1fr;
            }


            .application-actions {
                flex-direction: column;
            }


            .application-actions a,
            .application-actions button {
                width: 100%;
                text-align: center;
            }

        }

    </style>

</head>


<body>


    <main class="admin-page">


        <div class="admin-container">


            <!-- ШАПКА -->

            <header class="admin-header">

                <div>

                    <p class="admin-subtitle">
                        ARTIUS · ЦЕНТР ТАЛАНТОВ
                    </p>

                    <h1>
                        Заявки
                    </h1>

                    <p class="admin-description">
                        Здесь отображаются заявки на бесплатные уроки.
                    </p>

                </div>


                <a
                    href="index.html"
                    class="admin-back"
                >
                    ← На сайт
                </a>

            </header>


            <!-- СТАТИСТИКА -->

            <section class="admin-stats">


                <div class="stat-card">

                    <span>
                        Новые
                    </span>

                    <strong id="newCount">
                        0
                    </strong>

                </div>


                <div class="stat-card">

                    <span>
                        Подтверждённые
                    </span>

                    <strong id="confirmedCount">
                        0
                    </strong>

                </div>


                <div class="stat-card">

                    <span>
                        Отклонённые
                    </span>

                    <strong id="rejectedCount">
                        0
                    </strong>

                </div>


            </section>


            <!-- ЗАЯВКИ -->

            <section
                class="applications"
                id="applications"
            ></section>


            <!-- НЕТ ЗАЯВОК -->

            <div
                class="empty-state"
                id="emptyState"
            >

                <div class="empty-icon">
                    📋
                </div>

                <h2>
                    Заявок пока нет
                </h2>

                <p>
                    Когда кто-нибудь отправит заявку
                    через сайт, она появится здесь.
                </p>

            </div>


        </div>


    </main>


    <script>


        const SUPABASE_URL =
            "https://udchymsnuxhwhnjcheuz.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_I1t8tO1sDu6nfaU6iF4rqg_d6jf0wpZ";


        let applications = [];


        // =========================
        // ЗАГРУЗКА ЗАЯВОК
        // =========================

        async function loadApplications() {


            try {


                const response = await fetch(

                    `${SUPABASE_URL}/rest/v1/applications?select=*&order=created_at.desc`,

                    {

                        method: "GET",

                        headers: {

                            "apikey": SUPABASE_KEY,

                            "Authorization":
                                `Bearer ${SUPABASE_KEY}`

                        }

                    }

                );


                if (!response.ok) {


                    const error =
                        await response.text();


                    console.error(error);


                    throw new Error(
                        "Ошибка загрузки"
                    );

                }


                applications =
                    await response.json();


                renderApplications();


            } catch (error) {


                console.error(error);


                document.getElementById(
                    "applications"
                ).innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            ⚠️
                        </div>

                        <h2>
                            Ошибка загрузки
                        </h2>

                        <p>
                            Не удалось загрузить заявки
                            из Supabase.
                        </p>

                    </div>

                `;

            }

        }


        // =========================
        // ИЗМЕНЕНИЕ СТАТУСА
        // =========================

        async function changeStatus(
            id,
            status
        ) {


            try {


                const response = await fetch(

                    `${SUPABASE_URL}/rest/v1/applications?id=eq.${id}`,

                    {

                        method: "PATCH",

                        headers: {

                            "apikey": SUPABASE_KEY,

                            "Authorization":
                                `Bearer ${SUPABASE_KEY}`,

                            "Content-Type":
                                "application/json",

                            "Prefer":
                                "return=minimal"

                        },


                        body: JSON.stringify({

                            status: status

                        })

                    }

                );


                if (!response.ok) {


                    const error =
                        await response.text();


                    console.error(error);


                    alert(
                        "Не удалось изменить статус."
                    );


                    return;

                }


                await loadApplications();


            } catch (error) {


                console.error(error);


                alert(
                    "Произошла ошибка."
                );

            }

        }


        // =========================
        // WHATSAPP
        // =========================

        function getWhatsAppNumber(phone) {


            let digits =
                phone.replace(/\D/g, "");


            if (
                digits.startsWith("8")
                &&
                digits.length === 11
            ) {

                digits =
                    "7" +
                    digits.slice(1);

            }


            if (
                digits.length === 10
                &&
                digits.startsWith("7")
            ) {

                digits =
                    "7" +
                    digits;

            }


            return digits;

        }


        // =========================
        // ЗАЩИТА HTML
        // =========================

        function escapeHtml(text) {


            if (!text) return "";


            return String(text)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        // =========================
        // ПОКАЗ ЗАЯВОК
        // =========================

        function renderApplications() {


            const container =
                document.getElementById(
                    "applications"
                );


            const emptyState =
                document.getElementById(
                    "emptyState"
                );


            if (!applications.length) {


                container.innerHTML = "";


                emptyState.style.display =
                    "block";


                updateStats();


                return;

            }


            emptyState.style.display =
                "none";


            applications.sort(
                (a, b) => {

                    const order = {

                        "Новая": 1,

                        "Подтверждена": 2,

                        "Отклонена": 3

                    };


                    return (
                        (order[a.status] || 4)
                        -
                        (order[b.status] || 4)
                    );

                }
            );


            container.innerHTML =
                applications.map(
                    application => {


                        let statusClass =
                            "status-new";


                        if (
                            application.status
                            ===
                            "Подтверждена"
                        ) {

                            statusClass =
                                "status-confirmed";

                        }


                        if (
                            application.status
                            ===
                            "Отклонена"
                        ) {

                            statusClass =
                                "status-rejected";

                        }


                        return `

                            <article
                                class="application-card"
                            >


                                <div
                                    class="application-top"
                                >

                                    <div>

                                        <span
                                            class="status ${statusClass}"
                                        >
                                            ${escapeHtml(
                                                application.status
                                                ||
                                                "Новая"
                                            )}
                                        </span>


                                        <h2>
                                            ${escapeHtml(
                                                application.name
                                            )}
                                        </h2>


                                        <span
                                            class="application-id"
                                        >
                                            Заявка №
                                            ${application.id}
                                        </span>

                                    </div>

                                </div>


                                <div
                                    class="application-info"
                                >


                                    <div
                                        class="info-item"
                                    >

                                        <span
                                            class="info-label"
                                        >
                                            Направление
                                        </span>

                                        <strong>
                                            ${escapeHtml(
                                                application.direction
                                            )}
                                        </strong>

                                    </div>


                                    <div
                                        class="info-item"
                                    >

                                        <span
                                            class="info-label"
                                        >
                                            Возраст
                                        </span>

                                        <strong>
                                            ${escapeHtml(
                                                application.age
                                            )}
                                        </strong>

                                    </div>


                                    <div
                                        class="info-item"
                                    >

                                        <span
                                            class="info-label"
                                        >
                                            Желаемая дата
                                        </span>

                                        <strong>
                                            ${escapeHtml(
                                                application.desired_date
                                            )}
                                        </strong>

                                    </div>


                                    <div
                                        class="info-item"
                                    >

                                        <span
                                            class="info-label"
                                        >
                                            Желаемое время
                                        </span>

                                        <strong>
                                            ${escapeHtml(
                                                application.desired_time
                                            )}
                                        </strong>

                                    </div>


                                    <div
                                        class="info-item"
                                    >

                                        <span
                                            class="info-label"
                                        >
                                            Телефон / WhatsApp
                                        </span>

                                        <strong>
                                            ${escapeHtml(
                                                application.phone
                                            )}
                                        </strong>

                                    </div>


                                </div>


                                ${
                                    application.comment
                                    ?
                                    `

                                    <div
                                        class="application-comment"
                                    >

                                        <span>
                                            Комментарий
                                        </span>

                                        <p>
                                            ${escapeHtml(
                                                application.comment
                                            )}
                                        </p>

                                    </div>

                                    `
                                    :
                                    ""
                                }


                                <div
                                    class="application-actions"
                                >


                                    <a
                                        class="whatsapp-button"
                                        href="https://wa.me/${getWhatsAppNumber(
                                            application.phone
                                        )}"
                                        target="_blank"
                                    >
                                        Написать в WhatsApp
                                    </a>


                                    <button
                                        class="confirm-button"
                                        onclick="changeStatus(
                                            ${application.id},
                                            'Подтверждена'
                                        )"
                                    >
                                        ✓ Подтвердить
                                    </button>


                                    <button
                                        class="reject-button"
                                        onclick="changeStatus(
                                            ${application.id},
                                            'Отклонена'
                                        )"
                                    >
                                        ✕ Отклонить
                                    </button>


                                </div>


                            </article>

                        `;

                    }
                ).join("");



            updateStats();

        }


        // =========================
        // СТАТИСТИКА
        // =========================

        function updateStats() {


            const newCount =
                applications.filter(
                    app =>
                        app.status === "Новая"
                ).length;


            const confirmedCount =
                applications.filter(
                    app =>
                        app.status ===
                        "Подтверждена"
                ).length;


            const rejectedCount =
                applications.filter(
                    app =>
                        app.status ===
                        "Отклонена"
                ).length;


            document.getElementById(
                "newCount"
            ).textContent =
                newCount;


            document.getElementById(
                "confirmedCount"
            ).textContent =
                confirmedCount;


            document.getElementById(
                "rejectedCount"
            ).textContent =
                rejectedCount;

        }


        // =========================
        // ЗАПУСК
        // =========================

        loadApplications();


        // Проверяем новые заявки
        // каждые 10 секунд

        setInterval(
            loadApplications,
            10000
        );


    </script>
<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("service-worker.js")
                .then(() => console.log("ARTIUS готов к установке"))
                .catch(error => console.error("Ошибка:", error));
        });
    }
</script>

</body>

</html>
